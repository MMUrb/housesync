<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HouseSync</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7fb; color: #15151c;
    min-height: 100vh; display: grid; place-items: center;
    padding: 32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align: center; -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0a0a16; color: #eceef6; }
    p { color: #9698b0 !important; }
  }
  .mark {
    width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #6f5cf0, #4b36de);
    display: grid; place-items: center;
  }
  .mark svg { width: 34px; height: 34px; fill: #fff; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  p { margin-top: 8px; font-size: 15px; line-height: 1.55; color: #64748b; max-width: 300px; }
  button {
    margin-top: 24px; border: none; cursor: pointer;
    background: #5f3fe0; color: #fff; font: inherit; font-weight: 700; font-size: 15px;
    padding: 13px 32px; border-radius: 14px;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div>
    <div class="mark">
      <svg viewBox="0 0 24 24"><path d="M12 3 2.6 10.4a1 1 0 0 0 1.2 1.6L5 11v7.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V11l1.2 1a1 1 0 0 0 1.2-1.6Z"/></svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>HouseSync needs an internet connection. Check your Wi&#8209;Fi or mobile data, then try again.</p>
    <button onclick="window.location.replace('https://housesync.co.uk')">Try again</button>
  </div>
</body>
</html>
